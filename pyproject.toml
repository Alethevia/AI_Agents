[tool.poetry]
name = "institutional-trading-system"
version = "2.0.0"
description = "Experimental AI trading framework with Transformer and SAC RL"
authors = ["Alethevia"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = "^3.11"
torch = "^2.1.0"
numpy = "^1.26.0"
polars = "^0.19.0"
pandas = "^2.1.0"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
websockets = "^12.0"
redis = {extras = ["hiredis"], version = "^5.0.0"}
pydantic = "^2.4.0"
pydantic-settings = "^2.0.0"
structlog = "^23.2.0"
python-json-logger = "^2.0.7"
prometheus-client = "^0.19.0"
opentelemetry-api = "^1.21.0"
opentelemetry-sdk = "^1.21.0"
opentelemetry-instrumentation-fastapi = "^0.42b0"
httpx = "^0.25.0"
aiohttp = "^3.9.0"
ccxt = "^4.1.0"
yfinance = "^0.2.31"
akshare = "^1.11.0"
alpha-vantage = "^2.3.1"
anthropic = "^0.7.0"
openai = "^1.3.0"
transformers = "^4.35.0"
stable-baselines3 = "^2.2.0"
gym = "^0.26.2"
gymnasium = "^0.29.1"
scipy = "^1.11.0"
scikit-learn = "^1.3.0"
ta-lib = "^0.4.28"
pandas-ta = "^0.3.14b0"
vectorbt = "^0.25.0"
quantstats = "^0.0.62"
empyrical = "^0.5.5"
pyfolio = "^0.9.2"
zipline-reloaded = "^3.0.0"
riskfolio-lib = "^5.0.0"
cvxpy = "^1.4.0"
plotly = "^5.18.0"
dash = "^2.14.0"
streamlit = "^1.28.0"
celery = {extras = ["redis"], version = "^5.3.0"}
APScheduler = "^3.10.0"
psutil = "^5.9.0"
python-multipart = "^0.0.6"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
alembic = "^1.12.0"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.0"
motor = "^3.3.0"
pymongo = "^4.6.0"
qdrant-client = "^1.7.0"
duckdb = "^0.9.0"
pyarrow = "^14.0.0"
lz4 = "^4.3.0"
msgpack = "^1.0.7"
orjson = "^3.9.0"
ujson = "^5.8.0"
numba = "^0.58.0"
bottleneck = "^1.3.7"
ray = {extras = ["default"], version = "^2.8.0"}
optuna = "^3.4.0"
hyperopt = "^0.2.7"
pyyaml = "^6.0.1"
toml = "^0.10.2"
python-dotenv = "^1.0.0"
tenacity = "^8.2.0"
ratelimit = "^2.2.1"
cachetools = "^5.3.0"
joblib = "^1.3.0"
cloudpickle = "^3.0.0"
typing-extensions = "^4.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
pytest-xdist = "^3.5.0"
hypothesis = "^6.92.0"
black = "^23.11.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
mypy = "^1.7.0"
pylint = "^3.0.0"
bandit = "^1.7.0"
safety = "^2.3.0"
pre-commit = "^3.5.0"
ipython = "^8.17.0"
jupyter = "^1.0.0"
notebook = "^7.0.0"
locust = "^2.18.0"

[tool.poetry.scripts]
trading-system = "src.main:main"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=html --cov-report=term-missing"
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
